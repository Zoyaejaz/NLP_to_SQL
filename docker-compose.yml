services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nlp2sql
      POSTGRES_PASSWORD: nlp2sql
      POSTGRES_DB: nlp2sql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlp2sql -d nlp2sql"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://nlp2sql:nlp2sql@db:5432/nlp2sql
      READONLY_DATABASE_URL: postgresql+psycopg2://nlp_readonly:readonly@db:5432/nlp2sql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro
    # seed demo data on first start (no-op if tables already exist), then serve
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
