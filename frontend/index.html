<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NLP2SQL Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <link
  rel="icon"
  type="image/png"
  href="./assets/Icon.png"
/>
</head>
<body>
  <div class="app">
    <!-- ───────── Sidebar ───────── -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">NLP<span>2</span>SQL</div>
          <div class="brand-sub">Ask your database</div>
        </div>
      </div>

      <div class="status-row" id="status-row">
        <span class="pill" id="pill-db"><i></i>Postgres</span>
        <span class="pill" id="pill-llm"><i></i>LLM</span>
      </div>

      <button class="btn primary upload-btn" id="btn-upload" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
        Upload your data
      </button>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="schema" role="tab">Schema</button>
        <button class="tab" data-tab="history" role="tab">History</button>
        <button class="tab" data-tab="stats" role="tab">Stats</button>
      </nav>

      <div class="panel active" id="panel-schema">
        <div class="panel-actions">
          <span class="muted small" id="schema-meta"></span>
          <button class="icon-btn" id="btn-refresh-schema" title="Re-introspect database">↻</button>
        </div>
        <div id="schema-list" class="schema-list"></div>
      </div>
      <div class="panel" id="panel-history">
        <div class="panel-actions">
          <span class="muted small">Recent questions</span>
          <button class="icon-btn" id="btn-clear-history" title="Clear history">🗑</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
      <div class="panel" id="panel-stats">
        <div id="stats-grid" class="stats-grid"></div>
      </div>
    </aside>

    <!-- ───────── Main ───────── -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu">☰</button>
        <h1>Ask in plain English<span class="dot">.</span></h1>
        <div class="topbar-actions">
          <label class="switch" title="Send previous turns as context so you can say 'now filter that to 2025'">
            <input type="checkbox" id="toggle-context" checked />
            <span class="slider"></span><span class="switch-label">Follow-ups</span>
          </label>
          <button class="btn ghost" id="btn-new">New chat</button>
          <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
        </div>
      </header>

      <section class="feed" id="feed" aria-live="polite">
        <div class="empty" id="empty">
          <h2>What do you want to know?</h2>
          <p>Your question is turned into PostgreSQL, validated against the live schema, run read-only, and explained back to you.</p>
          <div class="chips" id="example-chips"></div>
        </div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="500" placeholder="e.g. Top 5 customers by total spend in the last 6 months" aria-label="Your question"></textarea>
        <button class="send" id="btn-send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </main>
  </div>

  <!-- Upload dialog (content is built by app.js) -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-h">
        <h3 id="modal-title">Upload your data</h3>
        <button class="icon-btn" id="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
